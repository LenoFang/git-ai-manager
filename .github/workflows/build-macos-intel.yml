name: Build macOS .app (Intel x86_64)

# 与 build-macos.yml 完全相同的打包流程，但跑在 Intel runner (macos-13) 上，
# 产出 x86_64 架构的 .app，供老款 Intel Mac 使用。
# 手动触发：仓库 Actions 页 -> Build macOS .app (Intel x86_64) -> Run workflow
on:
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python + tkinter
        # macOS 自带 python 不含 tkinter，必须用 Homebrew 的 python + python-tk
        run: |
          brew install python python-tk
          echo "$(brew --prefix python)/libexec/bin" >> "$GITHUB_PATH"

      - name: Install PyInstaller
        # Homebrew 的 python 被标记为 externally-managed (PEP 668)，
        # 必须 --break-system-packages 才能装到系统目录；
        # 之后 build-macos.command 里 `import PyInstaller` 命中，跳过它自己的 pip 安装。
        run: python3 -m pip install --break-system-packages --upgrade pyinstaller

      - name: Build .app
        run: bash build-macos.command

      - name: Zip .app (macOS zip 保留 bundle 结构与可执行位)
        run: cd dist && zip -r ../git-ai-manager-macos-intel.zip git-ai-manager.app

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-ai-manager-macos-intel
          path: git-ai-manager-macos-intel.zip
          retention-days: 30
